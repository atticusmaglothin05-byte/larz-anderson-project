<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Discourse & Literature project — Larz Anderson Auto Museum.">
  <title>Larz Anderson Auto Museum — Discourse & Literature</title>
  <link rel="preload" href="assets/larz-poster.jpg" as="image">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="loading-screen" id="loadingScreen" aria-live="polite">
    <div class="loading-mark"></div>
    <p>Loading introduction…</p>
  </div>

  <!--
    The section is intentionally much taller than the viewport.
    The video stays pinned while JavaScript maps scroll progress to video time.
    Change --intro-scroll-length in styles.css to make the sequence faster/slower.
  -->
  <section class="scroll-sequence" id="scrollSequence" aria-label="Larz Anderson Museum aerial introduction">
    <div class="intro-stage">
      <video
        id="introVideo"
        class="intro-video"
        muted
        playsinline
        preload="auto"
        poster="assets/larz-poster.jpg"
        aria-label="Aerial approach to the Larz Anderson Auto Museum"
      ></video>

      <div class="scroll-cue" id="scrollCue" aria-hidden="true">
        <span>Scroll</span>
        <span class="scroll-cue-line"></span>
      </div>

      <div class="intro-progress" aria-hidden="true">
        <span id="introProgress"></span>
      </div>
    </div>
  </section>

  <!-- Replace this placeholder with the rest of your website. -->
  <main class="site-content" id="mainContent">
    <section class="content-shell">
      <p class="eyebrow">Discourse &amp; Literature</p>
      <h1>Larz Anderson Auto Museum</h1>
      <p class="lead">
        Your main website begins here. Replace this section with the museum project content,
        navigation, images, research, and interactive elements.
      </p>
    </section>
  </main>
</body>
</html>
